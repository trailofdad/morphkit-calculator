name: Stage publish

# Stages the tagged version on npm via trusted publishing (OIDC). Staging does
# not make the version public: a maintainer approves it with 2FA
# (`npm stage list` / `npm stage approve <stage-id>`) and cuts the GitHub
# Release by hand.

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use caching in release builds

      # `npm stage` needs npm >= 11.21; the version bundled with Node may be older.
      - run: npm install -g npm@11.21.1

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Runs prepublishOnly (clean-tree check, typecheck, tests, build) first.
      - run: npm stage publish
